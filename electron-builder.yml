appId: com.sellerkit.app
productName: SellerKit
# 版本元数据单一来源：不设 buildVersion，产物 CFBundleVersion / version 一律继承 package.json。
# 曾设 buildVersion: 1.0.0 而 package.json 已到 1.0.4，导致产物元数据与实际版本分歧，
# 并让 electron-updater 的版本比对失去唯一可信来源。
directories:
  output: release
files:
  - dist/**/*
  # 桥运行时源码文本：不参与 tsc 编译（见 tsconfig.electron.json 注释），必须原样进包
  # —— plugin-ui-protocol.ts#loadRuntimeSource 的第 1 个候选就是 <appPath>/electron/plugin-ui-runtime.js。
  # 漏掉它：打包版不注入 sk-plugin:// 桥 → 所有 UI 岛 window.__sk 缺失 → 点导航一片空白（2026-09-24 定位）。
  - electron/plugin-ui-runtime.js
  - "!node_modules/**/{test,tests,__tests__,spec}/**"
  - "!node_modules/**/*.md"
  - "!node_modules/**/*.ts"
extraResources:
  - from: 默认模板.txt
    to: 默认模板.txt
  # 托盘图标（M5·T5-1）：`main.ts#trayIconPath()` 打包版读 `<resources>/` 下的图标。
  # 漏了它 = 打包版没有托盘 = 关窗就退出 = 开机自启之后找不到应用。
  - from: build/icon.png
    to: icon.png
  # macOS 菜单栏模板图（透明底单色 S）：1x 与 @2x 必须同时带，
  # nativeImage.createFromPath('tray-template.png') 靠同目录的 @2x 文件合并表示。
  - from: build/tray-template.png
    to: tray-template.png
  - from: build/tray-template@2x.png
    to: tray-template@2x.png
afterPack: ./scripts/afterPack.js
# macOS 双架构：arm64（Apple Silicon）+ x64（Intel），dmg / zip 各自产出（zip 供 electron-updater 更新）
mac:
  target:
    - target: dmg
      arch:
        - arm64
        - x64
    - target: zip
      arch:
        - arm64
        - x64
  category: public.app-category.utilities
  icon: build/icons/mac/icon.icns
  artifactName: "${productName}-${version}-mac-${arch}.${ext}"
  hardenedRuntime: false
  gatekeeperAssess: false
  asar: true
  asarUnpack:
    - "**/*.node"
  extendInfo:
    CFBundleDisplayName: SellerKit
    CFBundleName: SellerKit
win:
  target:
    - target: nsis
      arch:
        - x64
    - target: portable
      arch:
        - x64
  icon: build/icons/win/icon.ico
# artifactName 拆到 nsis / portable 各自命名，避免同名产物互相覆盖
nsis:
  artifactName: "${productName}-${version}-win-${arch}-setup.${ext}"
  oneClick: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: "SellerKit"
portable:
  artifactName: "${productName}-${version}-win-${arch}-portable.${ext}"
# 自动更新发布源：GitHub Releases（主进程 updater.ts setFeedURL 与此保持一致）
# 发布流程：bump package.json version → npm run dist（electron-builder 自动打 tag vX.Y.Z 并上传 release 资产）
publish:
  provider: github
  owner: SayakABC
  repo: SellerKit
  private: false
