<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <!--
      内容安全策略（S0/S1，2026-11-04）。

      为什么必须有：主窗口是唯一持有完整 window.electronAPI 的上下文。此前它没有任何 CSP，
      eval / new Function 畅通，于是「插件经 jsExpression 在宿主执行任意代码」可以直接
      读业务库、读白名单文件、经 net-request 外带。求值已搬到隔离窗口
      （electron/rule-eval-window.ts），这里把主窗口的 eval 通道彻底关掉，作为第二道防线。

      逐条理由：
        default-src 'self'           兜底：没列的一律只允许自身
        script-src 'self'            **没有 unsafe-eval / unsafe-inline** —— 这是本条的核心；
                                     首屏主题脚本已外置为 /theme-init.js（不然就得开 unsafe-inline）
        style-src 'self' 'unsafe-inline'  Vue scoped 样式与 :style 绑定需要
        img-src 'self' data: blob:   订单/产品图经 IPC 读成 dataURL；截图预览用 blob:
        connect-src 'self' ws://localhost:5173 …  业务请求走 net-request IPC，不占 connect-src；
                                     这两条只为 dev 的 vite HMR（生产用不到，留着不影响安全）
        frame-src sk-plugin: sk-mail:  UI 岛（sk-plugin://）与邮件正文（sk-mail://，自带更严 CSP）
        object-src 'none' / base-uri 'none' / form-action 'none'  一律关死
    -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self' ws://localhost:5173 ws://127.0.0.1:5173 http://localhost:5173 http://127.0.0.1:5173; frame-src sk-plugin: sk-mail:; media-src 'self' blob:; object-src 'none'; base-uri 'none'; form-action 'none'"
    />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!--
      品牌图标（2026-11-06）：单一来源 brand/logo-icon.svg，Vite 会把它当 asset
      按 base:'./' 重写成相对路径，dev server 与 Electron loadFile 下都能加载。
      显式指定 rel=icon 后浏览器不再盲请求 /favicon.ico（此前主窗口一直吃 404）。
      CSP 的 img-src 已含 'self'，同源资源不受影响。
    -->
    <link rel="icon" type="image/svg+xml" href="./brand/logo-icon.svg" />
    <title>SellerKit</title>
    <!--
      首屏防闪白 / 防闪黑：见 public/theme-init.js 头部说明（为何不能再写成内联脚本）。
      必须是**同步**的普通脚本（不加 defer/async）：它要在样式表与模块脚本之前落定 data-theme。
    -->
    <script src="/theme-init.js"></script>
    <!--
      浏览器预览垫片：`npm run dev:web`（只起 vite）时补一个「任何 IPC 都显式失败」的空桥，
      否则 `src/core/services/ipc.ts` 在模块加载期取 `window.electronAPI.platform` 会直接抛错、整页白屏。
      必须是**同步**普通脚本（不加 defer/async），且必须排在模块脚本之前 —— 它要在 `ipc.ts` 求值前落下。
      两道自守：桥已存在（Electron preload 已注入）直接返回；非 http(s)（打包产物是 file://）直接返回。
      CSP 是 `script-src 'self'`（没有 unsafe-inline），所以只能外置成 public/web-bridge.js。
    -->
    <script src="/web-bridge.js"></script>
    <!--
      同一目的的第二道：主样式表是 <script type="module"> 的同级产物，解析前 body 会先按 UA 默认色（白）绘制一次。
      此处内联给画布色兜底，使「首帧白 → 主题色」变成「一直就是主题色」。
      数值必须与 src/styles/index.css 的 --wb-bg 保持一致（此处不能读 CSS 变量：变量正来自还没加载的那张表）。
    -->
    <style>
      html,
      body {
        margin: 0;
        background: #f6f7f9;
      }
      html[data-theme='dark'],
      html[data-theme='dark'] body {
        background: #15171c;
      }
    </style>
  </head>
  <!-- 画布色由 src/styles/index.css 的 body 规则统一负责（原先在这里硬编码 bg-gray-100，
       与 --wb-bg 差 2 级色阶，超滚动时会看到一条色差）。 -->
  <body class="min-h-screen">
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
