<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- 勿删 frame-src sk-mail:：正文 iframe 靠它才能被嵌进本页（两层 CSP 取交集，宿主放行了这里也得放行）。
         删了的症状是正文区整块空白、浏览器只在日志里报 ERR_BLOCKED_BY_CSP。
         守卫：tests/islandMailFrameCsp.spec.ts -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self'; frame-src sk-mail:"
    />
    <title>店铺账号管家</title>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
